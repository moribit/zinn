name: checks
on: [push, pull_request]
jobs:
  host-and-firmware:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig version
      - run: zig fmt --check build.zig build.zig.zon src examples tests tools
      - run: zig build test --summary all
      - run: zig build test -Doptimize=safe
      - run: zig build xor
      - run: zig build firmware
      - run: zig build size 2>&1 | tee size-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}
          path: |
            zig-out/bin/zinn-xor
            size-report.txt
